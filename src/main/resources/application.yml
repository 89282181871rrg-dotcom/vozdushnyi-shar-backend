spring:
  application:
    name: balloon

  # Профиль по умолчанию — H2 в файле. Запуск одной командой, без Docker и без БД.
  datasource:
    url: jdbc:h2:file:./data/balloon;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8080

balloon:
  config:
    # Внешний файл игровой конфигурации. Путь можно переопределить:
    #   java -jar balloon.jar --balloon.config.path=/etc/balloon/game.yml
    path: config/game-config.yml
    # Автоподхват изменений файла перед следующим раундом.
    # Выключать только если нужна полностью фиксированная конфигурация.
    auto-reload: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    ru.fsp.balloon: INFO

---
# Профиль docker: PostgreSQL из docker-compose
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:balloon}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USER:balloon}
    password: ${DB_PASSWORD:balloon}
  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.PostgreSQLDialect
