# ============================================================================
#  КОНФИГУРАЦИЯ ИГРЫ «ВОЗДУШНЫЙ ШАР»
# ============================================================================
#
#  Это единственный источник игровых параметров. Менять поведение игры можно
#  правкой этого файла — перезапуск сервиса и правка исходного кода не нужны.
#
#  КАК ПРИМЕНИТЬ ИЗМЕНЕНИЯ
#    Сервис проверяет время изменения файла перед каждым раундом и
#    подхватывает новую версию автоматически. Следующий начатый раунд уже
#    играет по новым правилам. Идущий раунд доигрывает по старым — иначе
#    результат было бы невозможно воспроизвести.
#
#    Можно и вручную:  POST /api/admin/config/reload
#    Что сейчас в силе: GET  /api/config/public
#
#  ЕСЛИ ОШИБИТЬСЯ В ЗНАЧЕНИИ
#    Конфигурация проверяется при загрузке. Если значение недопустимо, сервис
#    НЕ применяет новый файл: продолжает работать на прошлой рабочей версии
#    и возвращает список ошибок. Игра не падает.
#
#  ЕДИНИЦЫ
#    Бонусные баллы — целые. Коэффициенты — дробные, точка как разделитель.
# ============================================================================

game:
  id: balloon                    # техническое имя игры
  name: "Воздушный Шар"          # отображаемое имя
  active: true                   # false — игра закрыта, новые раунды не создаются

# ----------------------------------------------------------------------------
#  СТАВКИ — четыре фрагмента пазла на экране выбора
# ----------------------------------------------------------------------------
#  cost             — сколько бонусных баллов списывается
#  boosterMultiplier— во сколько раз бустер умножит коэффициент.
#                     1 = фрагмент без бустера, маркер на поле не появится.
#  Допустимо: cost > 0, boosterMultiplier от 1 до 10.
#  Ровно 4 варианта — столько мест на экране выбора ставки.
bets:
  - { id: 1, cost: 10,  boosterMultiplier: 1 }
  - { id: 2, cost: 25,  boosterMultiplier: 2 }
  - { id: 3, cost: 50,  boosterMultiplier: 3 }
  - { id: 4, cost: 100, boosterMultiplier: 4 }

# ----------------------------------------------------------------------------
#  ТЕМЫ — зелёная и красная версии игры
# ----------------------------------------------------------------------------
#  Отличаются количеством уровней, а значит длиной полёта и риском.
#  Количество уровней задано постановкой: зелёная 9, красная 12.
#
#  levelMultipliers — коэффициент на границе каждого уровня.
#    Список ДОЛЖЕН содержать ровно levels значений и строго возрастать.
#    Первое значение — граница первого уровня: только после её прохождения
#    кнопка «Забрать» становится активной.
#
#  lootProbabilities — вероятность, что бустер окажется на этом уровне.
#    Столько же значений, сколько уровней. Сумма приводится к 1 автоматически,
#    так что можно писать любые веса: 10/20/30 работает так же, как 0.1/0.2/0.3.
#    Чем дальше уровень, тем рискованнее его ждать — поэтому веса растут.
themes:

  green:
    levels: 9
    levelMultipliers: [1.20, 1.50, 1.90, 2.40, 3.10, 4.00, 5.20, 6.80, 9.00]
    lootProbabilities: [4, 6, 9, 12, 15, 16, 15, 13, 10]

  red:
    levels: 12
    levelMultipliers: [1.15, 1.40, 1.70, 2.10, 2.60, 3.20, 4.00, 5.00, 6.30, 8.00, 10.50, 14.00]
    lootProbabilities: [3, 4, 6, 8, 10, 12, 13, 13, 12, 10, 6, 3]

# ----------------------------------------------------------------------------
#  МАТЕМАТИЧЕСКАЯ МОДЕЛЬ
# ----------------------------------------------------------------------------
#  Точка краха вычисляется на сервере ДО начала полёта и клиенту не отдаётся.
#  Клиент получает только текущий коэффициент и рисует анимацию.
#
#  Модель: crash = minCrashMultiplier / (1 - u·(1 - houseEdge))^alpha, где u — равномерное
#  случайное число на [0, 1). Это стандартное распределение для crash-игр:
#  короткие полёты частые, длинные редкие, средний множитель конечен.
#
#  alpha                — «хвост» распределения. Больше значение → чаще
#                         длинные полёты и крупные выигрыши. Диапазон 0.1–2.0.
#  minCrashMultiplier   — минимально возможный коэффициент краха.
#                         Ниже него шар лопнуть не может.
#  maxMultiplier        — потолок. Всё, что выше, обрезается до него.
#  multiplierGrowthRate — насколько быстро растёт коэффициент во время полёта.
#                         Влияет на длительность раунда, не на вероятности.
#  fps                  — частота пересчёта коэффициента на сервере.
#  houseEdge            — доля, оставляемая заведению. 0.03 = 3%.
#                         Ровно на эту величину сдвигается распределение.
#
#  ПРОВЕРИТЬ МОДЕЛЬ:  GET /api/config/simulate?rounds=10000&theme=green
#  Эндпоинт прогоняет серию раундов и печатает распределение — обоснование
#  моделью, а не исходом одного случайного раунда.
math:
  alpha: 1.0
  minCrashMultiplier: 1.00
  maxMultiplier: 100.0
  multiplierGrowthRate: 0.06
  fps: 30
  houseEdge: 0.03

# ----------------------------------------------------------------------------
#  ИГРОВЫЕ ОЧКИ
# ----------------------------------------------------------------------------
#  Очки — отдельная валюта, они НЕ бонусные баллы. Начисляются всегда,
#  и при выигрыше, и при проигрыше. Нужны для турнирной механики.
#
#  ЭТО ТОТ САМЫЙ ПАРАМЕТР, КОТОРЫЙ МЕНЯЕТ ЭКСПЕРТ В СЦЕНАРИИ 5:
#  поменяйте pointsPerLevel, начните новый раунд — начисление изменится.
points:
  perLevel: 10                   # за прохождение каждого уровня
  cashoutBonus: 25               # разово за успешный «Забрать»
  boosterBonus: 50               # разово за сработавший бустер

# ----------------------------------------------------------------------------
#  НАГРАДА ЗА РАУНД
# ----------------------------------------------------------------------------
#  По постановке награда выдаётся и при выигрыше, и при проигрыше, а её
#  механику команда определяет сама. У нас это фрагмент коллекции: собрал
#  все — получил бонусные баллы. Так награда встроена в прогресс, а не
#  висит декоративной иконкой.
reward:
  enabled: true
  collectionSize: 6              # сколько фрагментов в полном наборе
  bonusForFullSet: 250           # бонусные баллы за собранный набор
  dropChanceOnWin: 100           # шанс выпадения при выигрыше, %
  dropChanceOnLoss: 40           # шанс выпадения при проигрыше, %

# ----------------------------------------------------------------------------
#  ПОВЕДЕНИЕ ЭКРАНА РЕЗУЛЬТАТА
# ----------------------------------------------------------------------------
round:
  idleTimeoutSeconds: 10         # бездействие на экране результата → переход
  autoSettleAfterSeconds: 120    # страховка: зависший раунд закрывается сервером

# ----------------------------------------------------------------------------
#  ОКНО «ЗАКРЕПИ УСПЕХ» — необязательный модуль
# ----------------------------------------------------------------------------
upsell:
  enabled: false                 # включать, только когда базовый цикл готов
  minWinAmount: 50               # показывать при выигрыше не меньше этого
  popupTimeoutSeconds: 10        # автозакрытие без реакции игрока
  oncePerSession: true           # не раздражать повторными показами

# ----------------------------------------------------------------------------
#  ДЕМОНСТРАЦИОННЫЙ ПОЛЬЗОВАТЕЛЬ
# ----------------------------------------------------------------------------
#  Создаётся при старте, если его ещё нет. Нужен, чтобы эксперт прошёл
#  все сценарии сразу, не регистрируясь. Пополнить баланс в любой момент:
#  POST /api/users/demo/topup?amount=1000
demo:
  username: demo
  startingBalance: 1000
